<div class="dash">
  <mat-card class="dashboard-card">
    
    <mat-card-header>
      <mat-card-title class="DashTitle">Dashboard</mat-card-title>
    </mat-card-header>

    <mat-card-content class="DashCont">
      <p>Total Number of Assets : {{ totalAssets() }}</p>
      <p>Assigned : {{ assignedAssets() }}</p>
      <p>Available : {{ unassignedAssets() }}</p>
    </mat-card-content>

  </mat-card>
</div>
