<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings</title>
</head>

<body>
<div class="container">

  <!-- Sidebar -->
  <!-- <div class="sidebar">
    <h2>Settings</h2>
    <a href="#" class="active">Profile</a>
    <a href="#">Change Password</a>
    <a href="#">Notifications</a>
    <a href="#">Role Management</a>
  </div> -->

  <!-- Main -->
  <div class="main">
    <div class="header">Account Settings</div>

    <div class="grid">

      <!-- Profile -->
      <div class="card">
        <form [formGroup]="profileForm" (submit)="updateProfile()">
            <h3>Profile</h3>

            <label>Name</label>
            <input type="text" formControlName = "Name" placeholder="John Doe">

            <label>Email</label>
            <input type="email" formControlName = "Email" placeholder="john@example.com"/>

            <!-- <label>Department</label>
            <input type="text" placeholder="IT / Operations"/> -->

            <button type="submit">Save Profile</button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="card">
      <form [formGroup]="passwordForm" (submit)="updatePassword()">
        <h3>Change Password</h3>

        <label>Current Password</label>
        <input type="password" formControlName="CurrentPassword"/>

        <label>New Password</label>
        <input type="password" formControlName="NewPassword"/>

        <label>Confirm Password</label>
        <input type="password" formControlName="ConfirmPassword"/>

        <button>Update Password</button>
      </form>
      </div>

      <!-- Notifications -->
      <div class="card">
        <h3>Notification Preferences</h3>

        <label>Asset Updates</label>
        <select>
          <option>Email</option>
          <option>In-App</option>
          <option>Both</option>
          <option>None</option>
        </select>

        <label>Maintenance Alerts</label>
        <select>
          <option>Email</option>
          <option>In-App</option>
          <option>Both</option>
          <option>None</option>
        </select>

        <label>System Announcements</label>
        <select>
          <option>Email</option>
          <option>In-App</option>
          <option>Both</option>
          <option>None</option>
        </select>

        <button>Save Preferences</button>
      </div>

      <!-- Role Management (Admin only) -->
      <div class="card">
        <h3>Role Management</h3>

        <table class="role-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>John Doe</td>
              <td><span class="badge admin">Admin</span></td>
              <td><button>Edit</button></td>
            </tr>

            <tr>
              <td>Sarah Smith</td>
              <td><span class="badge manager">Asset Manager</span></td>
              <td><button>Edit</button></td>
            </tr>

            <tr>
              <td>Mike Lee</td>
              <td><span class="badge viewer">Viewer</span></td>
              <td><button>Edit</button></td>
            </tr>
          </tbody>
        </table>

      </div>

    </div>
  </div>
</div>
</body>
</html>
