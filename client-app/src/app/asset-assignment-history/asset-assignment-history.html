<h2 mat-dialog-title class="DialogTitle">Asset {{data.asset_id}}: {{data.name}}</h2>
<div style="padding: 5px;">
    <table mat-table [dataSource]="assetHistory()">
        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef>Index</th>
            <td mat-cell *matCellDef="let element; let i = index">
            {{i + 1}}
            </td>
        </ng-container>


        <!-- NAME -->
        <ng-container matColumnDef="assignedTo">
            <th mat-header-cell *matHeaderCellDef>Assigned To</th>
            <td mat-cell *matCellDef="let element">
            <p style="font-weight: 500;">{{element.user?.username|| '....'}}</p>
            </td>
        </ng-container>

        <ng-container matColumnDef="assignedAt">
            <th mat-header-cell *matHeaderCellDef>Assigned On</th>
            <td mat-cell *matCellDef="let element">
            <p style="font-weight: 500; color:#e91e63;">{{element.assigned_at}}</p>
            </td>
        </ng-container>

        <ng-container matColumnDef="returnedAt">
            <th mat-header-cell *matHeaderCellDef>Returned On</th>
            <td mat-cell *matCellDef="let element">
            <p style="font-weight: 500; color:green;">{{element.returned_at||'...'}}</p>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['index','assignedTo', 'assignedAt', 'returnedAt']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['index','assignedTo', 'assignedAt', 'returnedAt'];"></tr>
    </table>
    <mat-paginator
      [length]="total()"
      [pageSize]="10"
      (page)="onPageChange($event)">
    </mat-paginator>
</div>
