
<form [formGroup]="editForm">
    <h2 mat-dialog-title class="DialogTitle">Asset {{data.id}}</h2>
    <mat-dialog-content class="DialogContent">

        <mat-form-field class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="username">
        </mat-form-field>

        <mat-form-field class = "full-width">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role">
                <mat-option value="viewer">Viewer</mat-option>
                <mat-option value="manager">Manager</mat-option>
                <mat-option value="admin">Admin</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- <mat-form-field class="full-width">
            <mat-label>Brand</mat-label>
            <input matInput formControlName="brand">
        </mat-form-field> -->

            </mat-select>
        </mat-form-field> -->

        <!-- <mat-form-field class="full-width" formGroupName="attributesControls">
            <mat-label>Parameters Value</mat-label>
            <input matInput formControlName="value">
        </mat-form-field> -->

    <mat-dialog-actions>
        <button matButton="elevated" (click)="onSubmit()">Edit</button>
    </mat-dialog-actions>

</form>
