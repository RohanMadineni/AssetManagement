
<form [formGroup]="editForm">
    <h2 mat-dialog-title class="DialogTitle">Asset {{data.id}}</h2>
    <mat-dialog-content class="DialogContent">

        <mat-form-field class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
        </mat-form-field>

        <mat-form-field class = "full-width">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
                <mat-option value="assigned">Assigned</mat-option>
                <mat-option value="available">Available</mat-option>
                <mat-option value="under maintenance">Under Maintenance</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Brand</mat-label>
            <input matInput formControlName="brand">
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>$$ Purchase Price</mat-label>
            <input matInput formControlName="price">
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Warranty Expiration date</mat-label>
            <input matInput formControlName="warranty" type="date">
        </mat-form-field>

        <mat-form-field class="full-width" formGroupName="attributesControls">
            <mat-label>Parameter Name</mat-label>
            <mat-select formControlName="parameterID">
                <mat-option *ngFor = "let par of parameters()" [value]="par.id">{{par.name}}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field class="full-width" formGroupName="attributesControls">
            <mat-label>Parameters Value</mat-label>
            <input matInput formControlName="value">
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button matButton="elevated" (click)="onSubmit()">Edit</button>
    </mat-dialog-actions>

</form>
