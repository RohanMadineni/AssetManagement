<div class="assetlist-page">
  
  <mat-card class="filters">

    <mat-card-header>
      <div style="color: rgb(71, 70, 70);">
        <mat-card-title>
          Filters
        </mat-card-title>
      </div>

    </mat-card-header>

    <mat-card-content class = "filter-content">
    
      <mat-form-field class = "full-width">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="filters.category_id">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let cat of categories()" [value]="cat.id">
            {{ cat.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class = "full-width">
        <mat-label>status</mat-label>
        <mat-select [(ngModel)]="filters.status">
          <mat-option value="">All</mat-option>
          <mat-option value="assigned">Assigned</mat-option>
          <mat-option value="available">Available</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button (click)="onFilter()">
        <mat-icon>filter_list</mat-icon>
        Apply Filters
      </button>

    </mat-card-content>

  </mat-card>

  <mat-card class="asset-table">

    <mat-card-header>

      <div style="color: rgb(71, 70, 70);">
        <mat-card-title>
          Assets
        </mat-card-title>
      </div>

    </mat-card-header>

    <mat-card-content class = "Assetlist-content">
      
      <table mat-table [dataSource]="assets()" class="mat-elevation-z8">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let asset"> {{ asset.name }} </td>
        </ng-container>

        <!-- <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let asset"> {{ asset.status }} </td>
        </ng-container> -->

        <ng-container matColumnDef="actions" >
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let asset">
            <button mat-button color="primary" (click)="viewAsset(asset)">View</button>
            <button mat-button color="primary" (click)="editAsset(asset)">Edit</button>
            <button mat-button color="warn" (click)="deleteAsset(asset.id)">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

      <mat-paginator
        [length]="total"
        [pageSize]="10"
        (page)="onPageChange($event)" class="paginator-class">
      </mat-paginator>

    </mat-card-content>

  </mat-card>
</div>
