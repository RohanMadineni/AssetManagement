<div class="page-container">

  <!-- HEADER -->
  <div>
      <span *ngIf="user"><button matButton (click)="back.emit();"><mat-icon>keyboard_backspace</mat-icon>Back</button></span>
      <h1 class="page-title">Asset List <span *ngIf="user" style="color:rgb(130, 56, 192)">:  {{use_name}}</span></h1>
      <div class="welcome">
      <p>Manage and monitor all assets in the system</p>
      </div>
  </div>


  <!-- FILTER CARD -->
   <div style="padding-right: 20px;">
  <mat-card class="filter-card">

    <div class="filter-title">
      <mat-icon>filter_list</mat-icon>
      <span style="align-content: center;  margin-left:5px; font-weight:500;">Filters</span>
    </div>

    <div class="filter-grid">

      <mat-form-field class="full-width">
        <mat-label>Category</mat-label>
        <mat-select [(ngModel)]="filters.category_id">
          <mat-option value="">All Categories</mat-option>
          <mat-option *ngFor="let cat of categories()" [value]="cat.id">
            {{cat.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filters.status">
          <mat-option value="">All Status</mat-option>
          <mat-option value="assigned">Assigned</mat-option>
          <mat-option value="under maintenance">Under Maintenance</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="filter-actions">
        <button mat-raised-button (click)="onFilter()">
          <mat-icon>view_headline</mat-icon>
          Apply Filters
        </button>
      </div>

    </div>

  </mat-card>
</div>

<div style="padding: 15px; justify-items: center;">
  <!-- TABLE CARD -->
  <mat-card class="table-card">

    <table mat-table [dataSource]="assets()">

      <!-- INDEX -->
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>Index</th>
        <td mat-cell *matCellDef="let element; let i = index">
          <mat-icon>devices</mat-icon>{{i + 1}}
        </td>
      </ng-container>


      <!-- NAME -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">
          <p style="font-weight: 500;">{{element.name}}</p>
        </td>
      </ng-container>


      <!-- STATUS -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">

          <span class="status-chip"
            [ngClass]="{
              'available': element.status === 'available',
              'assigned': element.status === 'assigned',
              'maintenance': element.status === 'under maintenance'
            }"
            style="font-weight:500;"
          >
            {{element.status | titlecase}}
          </span>

        </td>
      </ng-container>


      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let element">

          <button mat-icon-button (click)="viewAsset(element)">
            <mat-icon style="color:blueviolet;">visibility</mat-icon>
          </button>

          <button mat-icon-button (click)="returnAsset(element.id)" style="color: green; background-color: white;height:70%;"><mat-icon>assignment_return</mat-icon></button>
          
          <button mat-icon-button (click)="editAsset(element)">
            <mat-icon style="color:blueviolet;">edit</mat-icon>
          </button>

        </td>
      </ng-container>

      <ng-container matColumnDef="returnAsset">
        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let element">
          
          <button mat-icon-button (click)="deleteAsset(element.id)">
            <mat-icon style="color:red;">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['index','name','status','actions', 'returnAsset']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['index','name','status','actions', 'returnAsset'];"></tr>

    </table>


    <mat-paginator
      [length]="total()"
      [pageSize]="10"
      (page)="onPageChange($event)">
    </mat-paginator>

  </mat-card>
</div>
</div>
