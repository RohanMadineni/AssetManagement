<div class="page">

  <mat-card class="login-card" >

    <mat-card-header>
      <div style="text-align: center; width: 100%; color: rgb(71, 70, 70);"><mat-card-title class="login-title">Login Page</mat-card-title></div>
    </mat-card-header>  

    <mat-card-content class="card-content">
      <!-- <div style="max-height: 100%;"> -->
      <form [formGroup]="loginform" (submit)="onLogin()">
        
        <mat-form-field class="full-width-input">
          <input matInput placeholder="Username" formControlName="username" required > 
        </mat-form-field>

        <mat-form-field class="full-width-input">
          <input  matInput  type="password" placeholder="Password" formControlName="password" required>
        </mat-form-field>
        <div style="width:100%; align-content: center; justify-content: center;"  >
          <button  matButton="filled" type="submit" color="primary" [disabled]="!loginform.valid">Login</button>
        </div>
      </form>
    <!-- </div> -->

    </mat-card-content>

  </mat-card>

</div>
