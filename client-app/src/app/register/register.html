<div class = "register-page">

  <mat-card class = "register-card">

    <mat-card-header>
        <div style="color: rgb(71, 70, 70);">
          <mat-card-title class="login-title">
            Register Page
          </mat-card-title> 
        </div>

    </mat-card-header>  

    <mat-card-content class = "register-content">

      <form [formGroup]="loginform" (submit)="onLogin()">

        <mat-form-field class="full-width-input">
          <input matInput placeholder="Username" formControlName="username" required > 
        </mat-form-field>

        <mat-form-field class="full-width-input">
          <input  matInput  type="password" placeholder="Password" formControlName="password" required>
        </mat-form-field>

        <mat-form-field>
          <mat-select formControlName = "role" placeholder="role">
            <mat-option value="viewer">Viewer</mat-option>
            <mat-option value="manager">Manager</mat-option>
            <mat-option value="admin">Admin</mat-option>
          </mat-select>
        </mat-form-field>
        <div>
        <button  matButton="filled" type="submit" color="primary" [disabled]="!loginform.valid">Register</button>  
        </div>
      </form>

    </mat-card-content>

  </mat-card>

</div>
