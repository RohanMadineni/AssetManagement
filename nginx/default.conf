server {
    listen 80;

    location / {
        proxy_pass http://frontend:80;
    }
    
    # location / {
    #     proxy_pass http://angular:4200;
    # }

    location /api/ {
        proxy_pass http://laravel:8000/api/;
    }

    location /login {
        proxy_pass http://laravel:8000/login;
    }

    location /sanctum/ {
        proxy_pass http://laravel:8000/sanctum/;
    }
}
