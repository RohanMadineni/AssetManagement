services:
  
  frontend: 
    build:
      context: ./client-app
      args:
        COMMIT_SHA: ${COMMIT_SHA}
    image: asset-frontend:${COMMIT_SHA}
    container_name: angular_client
    # ports:
    #   - "4200:80"
    expose:
      - "80"
    # volumes:
    #   - ./client-app:/app
    #   - angular_node_modules:/app/node_modules
    networks:
      - app-network
  
  laravel:
    build:
      context: ./laravel
    container_name: laravel_api
    environment:
      REALTIME_URL: http://realtime-server:3000
    # ports:
    #   - "8000:8000"
    expose:
      - "9000"
    # volumes:
    #   - ./laravel:/var/www/html
    #   - laravel_vendor:/var/www/html/vendor
    networks:
      - app-network

  realtime-server:
    build:
      context: ./realtime-server
    container_name: realtime_server
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: asset.exchange
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./realtime-server:/app
      - realtime_node_modules:/app/node_modules
    networks:
      - app-network 
    
  nginx:
    build:
      context: ./nginx
    container_name: gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - laravel
      - realtime-server
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq  
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  angular_node_modules:
  realtime_node_modules:
  laravel_vendor:

